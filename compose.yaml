services:
  selflib:
    # A public prebuilt image is not published yet. Build this version locally with Docker.
    build: .
    image: selflib:0.1.0
    pull_policy: never
    platform: linux/amd64
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
      DATA_DIR: /data
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000'
    volumes:
      - selflib-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '3'
volumes:
  selflib-data:
