name: Versioned container release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the checked-out release tag to GHCR (requires packages write permission)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require an exact release tag for publishing
        if: inputs.publish
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'Select a versioned release tag before publishing.'; exit 1 ;;
          esac
          test "$(node -p "'v'+require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Container name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.image.outputs.name }}:${{ inputs.publish && github.ref_name || 'build-check' }}
